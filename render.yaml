services:
  - type: web
    runtime: node
    name: donate-minhthu
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: donate-db
          property: connectionString

databases:
  - name: donate-db
    plan: free
